<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZauberWiki – Tricks & Erklärungen</title>
<style>
:root{--bg:#f6f3fa;--card:#fff;--tx:#241f2e;--mu:#6f6a7c;--ac:#6b3fa0;--ac2:#efe6fa;--bd:#e4def0;--ok:#2f8f5b;--wa:#c27a14;--er:#b83a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#4b2a7a,#8a4fc7);color:#fff;padding:28px 16px 22px}
.hero>div,.w{max-width:880px;margin:0 auto}
.hero h1{font-family:Georgia,serif;margin:0;font-size:2rem}.hero p{margin:4px 0 0;opacity:.85}
.w{padding:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;max-width:100%}
textarea{width:100%;min-height:100px;resize:vertical}input[type=text],input[type=url],input[type=search]{width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 13px;font-size:.88rem}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.c:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(107,63,160,.15)}
.ic{font-size:1.6rem}.c h3{margin:0;font-size:1.05rem}.c p{margin:0;color:var(--mu);font-size:.9rem}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px;background:var(--ac2);color:var(--ac)}
.d0{background:#e3f4ea;color:var(--ok)}.d1{background:#fbf0dc;color:var(--wa)}.d2{background:#f9e3e8;color:var(--er)}
.page{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:10px}
.page h2{margin:6px 0 8px;font-family:Georgia,serif;font-size:1.7rem}
.lead{color:var(--mu);font-size:1.05rem;margin:8px 0 16px}
.page h4{margin:20px 0 8px;color:var(--ac);text-transform:uppercase;letter-spacing:.05em;font-size:.82rem}
.step{display:flex;gap:12px;margin-bottom:10px}.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tip{background:var(--ac2);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
video{width:100%;border-radius:14px;background:#000;max-height:60vh}
a.vl{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600}
label{display:block;margin:14px 0 4px;font-weight:600}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
.mu{color:var(--mu);font-size:.85rem}.hide{display:none}.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:14px;right:14px;max-width:380px;margin-left:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:min(60vh,460px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
#cp.hide{display:none}
.ch{padding:10px 14px;font-weight:700;background:var(--ac2);color:var(--ac)}
#cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{background:var(--ac2);border-radius:12px;padding:6px 10px;max-width:85%;align-self:flex-start;overflow-wrap:anywhere}.m b{display:block;font-size:.75rem;color:var(--ac)}
.m.me{align-self:flex-end;background:var(--ac);color:#fff}.m.me b{color:#fff;opacity:.8}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1;min-width:0}
#gate{max-width:440px}input[type=password]{width:100%}#who{font-size:.9rem}#who button{padding:2px 10px;font-size:.8rem;margin-left:6px;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
.tl{color:var(--ac);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--ac);margin-right:10px;cursor:pointer}.tl.red{color:var(--er);border-color:var(--er)}.step .tl,.tip .tl{margin-right:0}
.cadm{display:none;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);align-items:center;font-size:.8rem}.cadm input[type=text]{flex:1;min-width:0;padding:4px 8px}.cadm button{padding:4px 10px}.ch{display:flex;gap:8px;align-items:center}.ch select{flex:1;min-width:0;padding:4px 8px;font-size:.9rem}.m{position:relative;padding-right:24px}.m .x{position:absolute;top:2px;right:2px;padding:0 6px;border:0;background:transparent;color:inherit;opacity:.6;font-size:.75rem;cursor:pointer}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>
<div class="hero"><div><h1>🎩 ZauberWiki</h1><p>Zaubertricks mit Erklärung – gemeinsam gesammelt.</p><p id="who" class="hide"></p></div></div>
<div id="gate" class="w"><p class="mu">Lade …</p></div>
<div id="app" class="w hide">
<div id="list"><div class="bar"><input id="q" type="search" placeholder="Tricks durchsuchen …"><button class="p" id="add">+ Neu</button></div>
<div class="chips" id="tabs"><button class="chip on" id="tt">🎩 Tricks</button><button class="chip" id="tn">🧩 Techniken</button></div>
<div class="chips" id="chips"></div><div class="grid" id="items"></div></div>
<div id="view" class="hide"></div><div id="form" class="hide"></div>
</div>
<button id="cb" class="p hide">💬 Chat</button>
<div id="cp" class="hide"><div class="ch"><select id="chs"></select></div><div class="cadm" id="cadm"><input id="cn" type="text" maxlength="40" placeholder="Neuer Kanal …"><label title="Wichtig: oben angeheftet, nur Admins schreiben"><input type="checkbox" id="cimp"> 📌</label><button id="cadd">+</button></div><div id="cm"></div><div class="mu" id="cro" style="display:none;padding:8px 12px"></div><div class="cin"><input id="ci" type="text" maxlength="500" placeholder="Nachricht schreiben …"><button class="p" id="cs">Senden</button></div></div>
<script>
const CATS=[["Karten","🃏"],["Münzen","🪙"],["Seil & Gummiband","🪢"],["Mentalmagie","🧠"],["Alltagsgegenstände","🥄"],["Mathe-Tricks","🔢"],["Sonstiges","✨"]];
const ICON=Object.fromEntries(CATS);const DIFF=["Anfänger","Fortgeschritten","Profi"];
let db=null,assets=null,me=null,uapi=null,uname="",chatOn=false,techniques=[],tab="t",curT=null,curFrom=null,chCur="",chatSet=null,lastOpen=null,tricks=[],cur=null,cat="";
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function show(w){if(w==="list"&&chatSet){chatSet("chat","Allgemein");cur=null;curT=null;lastOpen=null}["list","view","form"].forEach(k=>$(k).classList.toggle("hide",k!==w));window.scrollTo(0,0)}
function chips(){const b=$("chips");b.replaceChildren();[["","Alle"],...CATS.map(c=>[c[0],c[1]+" "+c[0]])].forEach(([v,l])=>{const x=el("button","chip"+(cat===v?" on":""),l);x.onclick=()=>{cat=v;chips();renderList()};b.append(x)})}
const dc=d=>"b d"+Math.max(0,DIFF.indexOf(d));
function renderList(){
  if(tab==="n"){renderTechs();return}
  const q=$("q").value.toLowerCase(),box=$("items");box.replaceChildren();
  if(!db){box.append(el("p","mu","Die gemeinsame Datenbank ist hier nicht verfügbar – bitte anmelden."));return}
  const f=tricks.filter(t=>(!cat||t.category===cat)&&(!q||(t.title+t.summary+t.props+t.explanation).toLowerCase().includes(q)));
  if(!f.length){box.append(el("p","mu",tricks.length?"Nichts gefunden.":"Noch keine Tricks – füge den ersten hinzu!"));return}
  f.forEach(t=>{const d=el("div","c");d.append(el("div","ic",ICON[t.category]||"✨"),el("h3",0,t.title));
    const m=el("div");m.append(el("span","b",t.category),el("span",dc(t.difficulty),t.difficulty));if(t.videoId||t.videoLink)m.append(el("span","b","▶ Video"));
    d.append(m,el("p",0,t.summary));d.onclick=()=>open(t.id);box.append(d)});
}
function open(id){
  const t=tricks.find(x=>x.id===id);if(!t)return;cur=t;curT=null;if(chatSet&&lastOpen!==t.id)chatSet("tricks/"+t.id+"/chat","Diskussion: "+t.title);lastOpen=t.id;const v=$("view");v.replaceChildren();
  const b=el("button",0,"← Alle Tricks");b.onclick=()=>show("list");v.append(b);
  const p=el("div","page");v.append(p);
  const m=el("div");m.append(el("span","b",(ICON[t.category]||"")+" "+t.category),el("span",dc(t.difficulty),t.difficulty));
  p.append(m,el("h2",0,t.title),el("p","lead",t.summary));
  if(t.videoId){const vd=el("video");vd.controls=true;vd.preload="metadata";vd.src="/_blob/"+t.videoId;p.append(vd)}
  if(/^https:\/\//.test(t.videoLink||"")){const a=el("a","vl","▶ Video ansehen");a.href=t.videoLink;a.target="_blank";a.rel="noopener noreferrer";const w=el("p");w.append(a);p.append(w)}
  if(t.props){p.append(el("h4",0,"Das brauchst du"),el("div",0,t.props))}
  if((t.techs||[]).length){p.append(el("h4",0,"Verwendete Techniken"));const tw=el("div");t.techs.forEach(n=>{const x=techByName(n);const a=el("a",x?"tl":"tl red",n);a.href="#";if(!x)a.title="Noch keine Seite – klicken zum Anlegen";a.onclick=e=>{e.preventDefault();x?openTech(x.id,t.id):(role!=="reader"&&editTech({name:n},t.id))};tw.append(a)});p.append(tw)}
  p.append(el("h4",0,"So funktioniert's"));
  t.explanation.split("\n").filter(l=>l.trim()).forEach(l=>{const mt=l.match(/^\s*(\d+)[.)]\s*(.*)$/);const s=el("div","step");if(mt){s.append(el("div","n",mt[1]),rich(mt[2],t.id))}else s.append(rich(l,t.id));p.append(s)});
  if(t.tips)p.append(el("h4",0,"Tipps & Varianten"),rich(t.tips,t.id,"tip"));
  p.append(el("p","mu","Zuletzt bearbeitet: "+new Date(t.updated||0).toLocaleDateString("de-DE")+(t.editorName?" von "+t.editorName:"")));
  const e=el("button","p","✎ Bearbeiten");e.onclick=()=>edit(t);e.style.display=canEdit(t)?"":"none";const dsc=el("button",0,"💬 Diskussion zu diesem Trick");dsc.onclick=()=>{if($("cp").classList.contains("hide"))$("cb").click()};const a=el("div","acts");a.append(e,dsc);adminBtns("tricks",t,a,()=>open(t.id));lockNote(p,t);p.append(a);show("view");
}
function edit(t){
  const f=$("form");f.replaceChildren();t=t||{};const pg=el("div","page");f.append(pg);
  pg.append(el("h2",0,t.id?"Trick bearbeiten":"Neuen Trick hinzufügen"));
  const F={};
  const field=(k,l,type,ph)=>{pg.append(el("label",0,l));const i=type==="area"?el("textarea"):el("input");if(type!=="area")i.type=type||"text";if(ph)i.placeholder=ph;i.value=t[k]||"";F[k]=i;pg.append(i)};
  field("title","Titel","text","z. B. Die verschwindende Münze");
  const r=el("div","row"),a=el("div"),b=el("div");
  a.append(el("label",0,"Kategorie"));F.category=el("select");CATS.forEach(c=>F.category.append(new Option(c[0],c[0])));F.category.value=t.category||CATS[0][0];a.append(F.category);
  b.append(el("label",0,"Schwierigkeit"));F.difficulty=el("select");DIFF.forEach(c=>F.difficulty.append(new Option(c,c)));F.difficulty.value=t.difficulty||DIFF[0];b.append(F.difficulty);
  r.append(a,b);pg.append(r);
  field("summary","Kurzbeschreibung (Was sieht das Publikum?)","area");
  field("props","Das brauchst du","text","z. B. Münze, Tuch");
  t.techsStr=(t.techs||[]).join(", ");field("techsStr","Techniken (mit Komma trennen – werden zu Wiki-Links)","text",techniques.slice(0,2).map(x=>x.name).join(", ")||"z. B. Misdirection, Palmieren");
  field("explanation","Erklärung – ein Schritt pro Zeile, z. B. „1. …“","area");F.explanation.style.minHeight="200px";
  field("tips","Tipps & Varianten (optional)","area");
  field("videoLink","Video-Link (optional, z. B. YouTube – öffnet sich in neuem Tab)","url","https://…");
  let file=null,rm=null;
  if(assets){pg.append(el("label",0,"Video hochladen (optional, bis 20 MB)"));const fi=el("input");fi.type="file";fi.accept="video/*";fi.onchange=()=>{file=fi.files[0]||null};pg.append(fi);
    if(t.videoId){const l=el("label");rm=el("input");rm.type="checkbox";l.append(rm,document.createTextNode(" Vorhandenes Video entfernen"));pg.append(l)}}
  const msg=el("p","mu"),s=el("button","p","Speichern"),c=el("button",0,"Abbrechen");c.onclick=()=>t.id?open(t.id):show("list");
  s.onclick=async()=>{
    const d={};for(const k in F)d[k]=F[k].value.trim();
    if(!d.title||!d.summary||!d.explanation){msg.textContent="Titel, Kurzbeschreibung und Erklärung sind Pflicht.";return}
    if(d.videoLink&&!/^https:\/\//.test(d.videoLink)){msg.textContent="Der Video-Link muss mit https:// beginnen.";return}
    if(file&&file.size>20*1048576){msg.textContent="Das Video ist größer als 20 MB.";return}
    s.disabled=true;msg.textContent="Speichere …";
    try{
      d.videoId=rm&&rm.checked?"":(t.videoId||"");
      if(file){msg.textContent="Video wird hochgeladen …";const u=await assets.upload(file);d.videoId=u.id}
      d.updated=Date.now();d.created=t.created||d.updated;d.locked=!!t.locked;d.techs=(d.techsStr||"").split(",").map(s=>s.trim()).filter(Boolean);delete d.techsStr;d.editor=me||"";d.editorName=uname;
      const ref=t.id?db.collection("tricks").doc(t.id):db.collection("tricks").doc();await ref.set(d);show("list");
    }catch(e){msg.textContent="Speichern nicht möglich (Berechtigung, Verbindung oder Video-Upload).";s.disabled=false}
  };
  const ac=el("div","acts");ac.append(s,c);pg.append(msg,ac);show("form");
}
function initChat(){
  const cb=$("cb"),cp=$("cp"),ms=$("cm"),inp=$("ci");let msgs=[],isOpen=false,unsub=null,ch="chat",chans=[],ctx=null;cb.classList.remove("hide");
  async function draw(){
    const ids=[...new Set(msgs.map(m=>m.uid).filter(Boolean))];let P={};
    try{if(uapi)P=await uapi.profiles(ids)}catch(e){}
    ms.replaceChildren();
    msgs.forEach(m=>{const mine=m.uid&&m.uid===me;const d=el("div","m"+(mine?" me":""));d.append(el("b",0,mine?"Du":(m.name||(P[m.uid]&&P[m.uid].name)||"Jemand")),el("span",0,m.text));if(role==="admin"){const x=el("button","x","✕");x.title="Nachricht löschen";x.onclick=()=>db.collection(ch).doc(m.id).delete().catch(()=>{});d.append(x)}ms.append(d)});
    ms.scrollTop=ms.scrollHeight;
  }
  cb.onclick=()=>{isOpen=!isOpen;cp.classList.toggle("hide",!isOpen);cb.textContent=isOpen?"✕ Schließen":"💬 Chat";if(isOpen){draw();inp.focus()}};
  chatSet=(path,title)=>{if(path==="chat")ctx=null;else if(!path.startsWith("channels/"))ctx={path,title};if(path===chCur){fillSel();return}chCur=path;ch=path;if(unsub)unsub();msgs=[];ms.replaceChildren();fillSel();setIn();unsub=db.collection(path).orderBy("ts","desc").limit(100).onSnapshot(s=>{msgs=s.docs.map(d=>({id:d.id,...(typeof d.data==="function"?d.data():d.data)})).reverse();if(isOpen)draw()},()=>{})};
  chatSet("chat","Allgemein");
  $("chs").onchange=()=>{const o=$("chs").options[$("chs").selectedIndex];chatSet(o.value,o.text)};
  db.collection("channels").orderBy("ts","asc").onSnapshot(s=>{chans=s.docs.map(d=>({id:d.id,...(typeof d.data==="function"?d.data():d.data)}));fillSel();setIn()},()=>{});
  $("cadm").style.display=role==="admin"?"flex":"none";
  $("cadd").onclick=async()=>{const n=$("cn").value.trim().slice(0,40);if(!n)return;try{await db.collection("channels").doc().set({name:n,important:$("cimp").checked,ts:Date.now(),by:uname});$("cn").value=""}catch(e){}};
  function fillSel(){const s=$("chs");s.replaceChildren();s.append(new Option("💬 Allgemein","chat"));if(ctx)s.append(new Option("📄 "+ctx.title,ctx.path));chans.slice().sort((a,b)=>(b.important?1:0)-(a.important?1:0)||(a.ts||0)-(b.ts||0)).forEach(c=>s.append(new Option((c.important?"📌 ":"# ")+c.name,"channels/"+c.id+"/chat")));s.value=ch}
  function setIn(){const m=chans.find(c=>"channels/"+c.id+"/chat"===ch);const ok=role!=="reader"&&!(m&&m.important&&role!=="admin");$("ci").parentNode.style.display=ok?"flex":"none";$("cro").style.display=ok?"none":"block";$("cro").textContent=role==="reader"?"👀 Mit dem Lese-Code kannst du nur mitlesen.":"📌 In diesem Kanal schreiben nur Admins."}
  async function send(){const t=inp.value.trim().slice(0,500);if(!t||$("ci").parentNode.style.display==="none")return;inp.value="";try{await db.collection(ch).doc().set({text:t,uid:me||"",name:uname,ts:Date.now()})}catch(e){inp.value=t}}
  $("cs").onclick=send;inp.onkeydown=e=>{if(e.key==="Enter")send()};
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("zauberwiki:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let role="",sess={inv:"",exp:0},hb=null,ownerFlag=false;
const dd=d=>typeof d.data==="function"?d.data():d.data;
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,"");
function sidGet(){if(me)return String(me).replace(/[^A-Za-z0-9_-]/g,"_");let s=LS.get("zwsid");if(!s){s=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");LS.set("zwsid",s)}return s}
async function isBanned(){try{return (await db.collection("bans").get()).docs.some(d=>d.id===sidGet())}catch(e){return false}}
async function invites(){try{return (await db.collection("invites").get()).docs.map(d=>({id:d.id,...dd(d)}))}catch(e){return []}}
async function findInvite(code){const h=await sha(norm(code));return (await invites()).find(i=>i.hash===h&&i.expires>Date.now())||null}
async function inviteValid(id){try{const x=(await db.collection("invites").get()).docs.find(d=>d.id===id);return !!x&&dd(x).expires>Date.now()}catch(e){return true}}
function forceOut(msg,again){
  if(hb){clearInterval(hb);hb=null}
  LS.del("zw");["app","who","cp","cb"].forEach(i=>$(i).classList.add("hide"));
  const g=$("gate");g.replaceChildren();g.classList.remove("hide");const pg=el("div","page");g.append(pg);
  pg.append(el("h2",0,again?"⏱ Zugang beendet":"🚫 Entfernt"),el("p",0,msg));
  if(again){const b=el("button","p","Neu anmelden");b.onclick=()=>location.reload();pg.append(b)}
}
function startSession(){
  const id=sidGet(),since=Date.now();
  const touch=async()=>{
    try{await db.collection("sessions").doc(id).set({name:uname,role,seen:Date.now(),since,owner:!!ownerFlag})}catch(e){}
    if(!ownerFlag&&sess.inv&&(Date.now()>sess.exp||!(await inviteValid(sess.inv))))forceOut("Dein Zeit-Code ist abgelaufen oder wurde widerrufen.",true);
  };
  touch();hb=setInterval(touch,60000);
  db.collection("bans").onSnapshot(s=>{if(!ownerFlag&&s.docs.some(d=>d.id===id))forceOut("Du wurdest vom Admin entfernt.",false)},()=>{});
}
function openAdmin(){
  const f=$("form");f.replaceChildren();const pg=el("div","page");f.append(pg);const un=[];
  const back=el("button",0,"← Zurück");back.onclick=()=>{un.forEach(u=>u());show("list")};
  const b1=el("div"),b2=el("div"),b3=el("div"),out=el("div","tip");out.style.display="none";
  const rs=el("select");[["member","✏️ Mitglied"],["reader","👀 Nur lesen"]].forEach(([v,l])=>rs.append(new Option(l,v)));
  const ds=el("select");[["3600000","1 Stunde"],["86400000","1 Tag"],["604800000","7 Tage"],["2592000000","30 Tage"]].forEach(([v,l])=>ds.append(new Option(l,v)));

async function gateInit(){

function slug(n){const s=n.toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");return s||"t"+Date.now()}

function rich(text,from,cls){
  const d=el("div",cls||"");const names=techniques.map(x=>x.name).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!names.length){d.textContent=text;return d}
  const re=new RegExp("("+names.join("|")+")","gi");
  text.split(re).forEach((part,i)=>{if(i%2===0){if(part)d.append(document.createTextNode(part));return}
    const x=techByName(part);if(!x){d.append(document.createTextNode(part));return}
