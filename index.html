<script>

function open(id){
  const t=tricks.find(x=>x.id===id);if(!t)return;cur=t;curT=null;if(chatSet&&lastOpen!==t.id)chatSet("tricks/"+t.id+"/chat","Diskussion: "+t.title);lastOpen=t.id;const v=$("view");v.replaceChildren();

function edit(t){
  const f=$("form");f.replaceChildren();t=t||{};const pg=el("div","page");f.append(pg);
  pg.append(el("h2",0,t.id?"Trick bearbeiten":"Neuen Trick hinzufügen"));

function initChat(){

const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

  const t=techniques.find(x=>x.id===id);if(!t)return;cur=null;curT=t;curFrom=from||null;

  t.explanation.split("\n").filter(l=>l.trim()).forEach(l=>{const mt=l.match(/^\s*(\d+)[.)]\s*(.*)$/);const s=el("div","step");if(mt){s.append(el("div","n",mt[1]),rich(mt[2],from))}else s.append(rich(l,from));p.append(s)});
  if(t.tips)p.append(el("h4",0,"Tipps & Varianten"),rich(t.tips,from,"tip"));

  if(role!=="reader"&&canEdit(t)){const nb=el("button",0,"+ "+(t.kind==="gimmick"?"Effekt":"Unterpunkt")+" darunter anlegen");nb.onclick=()=>editTech({parents:[t.id]},from,t.kind==="gimmick"?"gimmick":"tech");p.append(nb)}

function editTech(t,from,kind){
  t=t||{};kind=t.kind||kind||"tech";const f=$("form");f.replaceChildren();const pg=el("div","page");f.append(pg);
  pg.append(el("h2",0,t.id?(kind==="gimmick"?"Gimmick bearbeiten":"Technik bearbeiten"):(kind==="gimmick"?"Neues Gimmick anlegen":"Neue Technik anlegen")));

  pg.append(el("label",0,"Gehört zu (mehrere möglich – nichts gewählt = oberste Ebene)"));const ps=el("select");ps.multiple=true;ps.size=5;ps.style.width="100%";

  fld("summary","Kurzbeschreibung",true);
  fld("explanation","Erklärung – ein Schritt pro Zeile, z. B. „1. …“. Namen anderer Techniken werden automatisch verlinkt.",true);F.explanation.style.minHeight="200px";
  const msg=el("p","mu"),s=el("button","p","Speichern"),c=el("button",0,"Abbrechen");
  const dr=el("div","row"),d1=el("div");d1.append(el("label",0,"Schwierigkeit"));F.difficulty=el("select");F.difficulty.append(new Option("– keine –",""));DIFF.forEach(c=>F.difficulty.append(new Option(c,c)));F.difficulty.value=t.difficulty||"";d1.append(F.difficulty);const d2=el("div");d2.append(el("label",0,"Kategorie / Punkt"));F.category=el("select");F.category.append(new Option("– keine –",""));catList(kind==="gimmick"?"g":"n").forEach(c=>F.category.append(new Option(c[1]+" "+c[0],c[0])));F.category.value=t.category||"";d2.append(F.category);dr.append(d1,d2);pg.append(dr);
  fld("props","Das brauchst du",false,"z. B. Spielkarten");fld("tips","Tipps & Varianten (optional)",true);fld("videoLink","Video-Link (optional, https://…)",false,"https://…");
  let vfile=null,vrm=null;if(assets){pg.append(el("label",0,"Video hochladen (optional, bis 20 MB)"));const fi=el("input");fi.type="file";fi.accept="video/*";fi.onchange=()=>{vfile=fi.files[0]||null};pg.append(fi);if(t.videoId){const l=el("label");vrm=el("input");vrm.type="checkbox";l.append(vrm,document.createTextNode(" Vorhandenes Video entfernen"));pg.append(l)}}
  const pts=(t.points||[]).map(x=>({...x}));const pbox=el("div");
  const drawP=()=>{pbox.replaceChildren();pts.forEach((x,i)=>{const w=el("div","sec2");const ti=el("input");ti.type="text";ti.placeholder="Titel";ti.value=x.title||"";ti.oninput=()=>{x.title=ti.value};const tx=el("textarea");tx.placeholder="Erklärung";tx.value=x.text||"";tx.oninput=()=>{x.text=tx.value};const rm=el("button",0,"✕ Entfernen");rm.onclick=()=>{pts.splice(i,1);drawP()};w.append(ti,tx,rm);pbox.append(w)})};drawP();
  const pa=el("button",0,kind==="gimmick"?"+ Effekt hinzufügen":"+ Unterpunkt hinzufügen");pa.onclick=()=>{pts.push({title:"",text:""});drawP()};
  pg.append(el("label",0,kind==="gimmick"?"Effekte (mit Erklärung)":"Unterpunkte"),pbox,pa);
  c.onclick=()=>t.id?openTech(t.id,from):(from?open(from):show("list"));
  s.onclick=async()=>{
    const name=F.name.value.replace(/[^\p{L}\p{N} \-]/gu,"").trim(),sm=F.summary.value.trim(),ex=F.explanation.value.trim();
    if(!name||!sm||!ex){msg.textContent="Name (nur Buchstaben, Zahlen, Leerzeichen), Kurzbeschreibung und Erklärung sind Pflicht.";return}
    const id=t.id||slug(name);
    if(!t.id&&techniques.some(x=>x.id===id||x.name.toLowerCase()===name.toLowerCase())){msg.textContent="Diese Technik gibt es schon.";return}
    s.disabled=true;msg.textContent="Speichere …";
    let vid=vrm&&vrm.checked?"":(t.videoId||"");const vl=F.videoLink.value.trim();if(vl&&!/^https:\/\//.test(vl)){msg.textContent="Der Video-Link muss mit https:// beginnen.";s.disabled=false;return}if(vfile){if(vfile.size>20*1048576){msg.textContent="Das Video ist größer als 20 MB.";s.disabled=false;return}try{vid=(await assets.upload(vfile)).id}catch(e){msg.textContent="Video-Upload fehlgeschlagen.";s.disabled=false;return}}

    catch(e){msg.textContent="Speichern nicht möglich (Berechtigung oder Verbindung).";s.disabled=false}
