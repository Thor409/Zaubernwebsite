<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZauberWiki – Tricks & Erklärungen</title>
<style>
:root{--bg:#f6f3fa;--card:#fff;--tx:#241f2e;--mu:#6f6a7c;--ac:#6b3fa0;--ac2:#efe6fa;--bd:#e4def0;--ok:#2f8f5b;--wa:#c27a14;--er:#b83a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121b;--card:#211d2b;--tx:#efeaf6;--mu:#a49eb4;--ac:#b88cf0;--ac2:#2d2540;--bd:#383147}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#4b2a7a,#8a4fc7);color:#fff;padding:28px 16px 22px}
.hero>div,.w{max-width:880px;margin:0 auto}
.hero h1{font-family:Georgia,serif;margin:0;font-size:2rem}.hero p{margin:4px 0 0;opacity:.85}
.w{padding:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;max-width:100%}
textarea{width:100%;min-height:100px;resize:vertical}input[type=text],input[type=url],input[type=search]{width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 13px;font-size:.88rem;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.c:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(107,63,160,.15)}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px;background:var(--ac2);color:var(--ac)}
.d0{background:#e3f4ea;color:var(--ok)}.d1{background:#fbf0dc;color:var(--wa)}.d2{background:#f9e3e8;color:var(--er)}
.page{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:10px}
.page h2{margin:6px 0 8px;font-family:Georgia,serif;font-size:1.7rem}
.mu{color:var(--mu);font-size:.85rem}.hide{display:none}.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:14px;right:14px;max-width:380px;margin-left:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:min(60vh,460px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
#cp.hide{display:none}
#cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1;min-width:0}
#who{font-size:.9rem;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;display:inline-flex;gap:8px;align-items:center;margin-top:8px}
#who button{padding:2px 10px;font-size:.8rem;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);border-radius:8px;}
</style>
</head>
<body>
<div class="hero">
  <div>
    <h1>🎩 ZauberWiki</h1>
    <p>Zaubertricks mit Erklärung – gemeinsam gesammelt.</p>
    <div id="who">
      <span id="adminName">👤 Linus · Admin</span>
      <button id="btnAuth">Abmelden</button>
      <button id="btnCodes" style="background:#e6b800; border-color:#e6b800; color:#241f2e;">🔑 Codes</button>
      <button id="btnManage">⚙️ Verwalten</button>
    </div>
  </div>
</div>
<div id="app" class="w">
  <div id="list">
    <div class="bar"><input id="q" type="search" placeholder="Durchsuchen …"><button class="p" id="add">+ Neu</button></div>
    
    <!-- Hauptreiter -->
    <div class="chips" id="mainTabs">
      <button class="chip on" data-tab="tricks">🎩 Tricks</button>
      <button class="chip" data-tab="techniques">🧩 Techniken</button>
      <button class="chip" data-tab="gimmicks">🧰 Gimmicks</button>
    </div>
    
    <!-- Requisiten-Filter (wird per JavaScript befüllt) -->
    <div class="chips" id="filterChips"></div>
    
    <div class="grid" id="items"></div>
  </div>
  <div id="view" class="hide"></div>
  <div id="form" class="hide"></div>
</div>
<button id="cb" class="p">💬 Chat</button>
<script>
const $=id=>document.getElementById(id);

// Beispiel-Startdaten für alle drei Kategorien
const DEFAULT_DATA = [
  {id:"d1",type:"tricks",name:"Das springende Gummiband",cat:"Seil & Gummiband",diff:"Anfänger",eff:"✨ Teleportation",summary:"Ein Gummiband wechselt unsichtbar von zwei Fingern auf die anderen beiden.",explanation:"Spanne das Band um Zeige- und Mittelfinger. Beuge beim Schließen der Hand heimlich alle Fingerspitzen in das Band hinein..."},
  {id:"d2",type:"tricks",name:"Der 21-Karten-Trick",cat:"Karten",diff:"Anfänger",eff:"🧠 Gedankenlesen",summary:"Ein mathematischer Klassiker, bei dem du die gewählte Karte des Zuschauers errätst.",explanation:"Lege die Karten dreimal in 3 Reihen aus. Die Reihe mit der Zuschauerkarte muss beim Einsammeln immer in die Mitte der Stapel gelegt werden..."},
  {id:"d3",type:"techniques",name:"Der Double Lift (Doppelabheben)",cat:"Karten",diff:"Fortgeschritten",eff:"🧩 Kartentechnik",summary:"Zwei Karten unbemerkt als eine einzige Karte abheben und vorzeigen.",explanation:"Nutze den kleinen Finger der Haltehand, um unbemerkt eine kleine Lücke (Pinky Count) unter den obersten beiden Karten zu bilden..."},
  {id:"d4",type:"gimmicks",name:"Die Daumenspitze (Thumb Tip)",cat:"Sonstiges",diff:"Anfänger",eff:"🧰 Hilfsmittel",summary:"Ein künstlicher Daumen, um Tücher oder Flüssigkeiten verschwinden zu lassen.",explanation:"Das Hilfsmittel wird auf den Daumen gesteckt. Beim Verschwindenlassen schiebst du das Tuch in die Daumenspitze in deiner Faust..."}
];

let currentTab = "tricks";
let currentFilter = "Alle";
let isAdmin = true;

const CATEGORIES = {
  tricks: ["Alle", "🃏 Karten", "🪙 Münzen", "🪢 Seil & Gummiband", "🧠 Mentalmagie", "✨ Sonstiges"],
  techniques: ["Alle", "🃏 Griffe & Schnitte", "🃏 Falschmischen", "🪙 Münz-Palmierungen"],
  gimmicks: ["Alle", "Prepräparierte Karten", "Unsichtbare Fäden", "🧰 Alltags-Hilfsmittel"]
};

function show(w){$("list").classList.toggle("hide",w!=="list");$("view").classList.toggle("hide",w!=="view");$("form").classList.toggle("hide",w!=="form")}

// Baut die Filter-Chips dynamisch passend zum gewählten Reiter auf
function renderFilterChips() {
  const container = $("filterChips");
  container.innerHTML = "";
  const list = CATEGORIES[currentTab] || ["Alle"];
  
  list.forEach(catName => {
    const cleanName = catName.replace(/[^\w\säöüÄÖÜ&]/g, '').trim(); // Entfernt Emojis für den Abgleich
    const isSelected = currentFilter === catName || (currentFilter === "Alle" && catName === "Alle");
    
    const btn = document.createElement("button");
    btn.className = `chip ${isSelected ? 'on' : ''}`;
    btn.textContent = catName;
    btn.onclick = () => {
      currentFilter = catName;
      renderFilterChips();
      loadItems();
    };
    container.appendChild(btn);
  });
}

// Lädt die passenden Elemente (Tricks, Techniken oder Gimmicks)
function loadItems(){
  const itemsContainer = $("items");
  itemsContainer.innerHTML = "";
  const searchWord = $("q").value.toLowerCase();
  
  const savedData = localStorage.getItem("zauber_wiki_data");
  const allItems = savedData ? JSON.parse(savedData) : DEFAULT_DATA;
  
  // 1. Nach Hauptreiter filtern (Tricks vs Techniken vs Gimmicks)
  let filtered = allItems.filter(item => item.type === currentTab);
  
  // 2. Nach Suchbegriff filtern
  if (searchWord) {
    filtered = filtered.filter(item => item.name.toLowerCase().includes(searchWord));
  }
  
  // 3. Nach Unterkategorie-Chip filtern
  if (currentFilter !== "Alle") {
    filtered = filtered.filter(item => item.cat && currentFilter.includes(item.cat));
  }
  
  if(filtered.length === 0){
    itemsContainer.innerHTML = "<p class='mu'>In dieser Kategorie befinden sich noch keine Einträge.</p>";
    return;
  }
  
  filtered.forEach(item => {
    const card = document.createElement("div");
    card.className = "c";
    let icon = "✨";
    if (item.cat && item.cat.includes("Karten")) icon = "🃏";
    if (item.cat && item.cat.includes("Münzen")) icon = "🪙";
    if (item.cat && item.cat.includes("Seil")) icon = "🪢";
    if (item.cat && item.cat.includes("Mental")) icon = "🧠";

    card.innerHTML = `
      <div style="font-size:1.5rem; margin-bottom:4px;">${icon}</div>
      <h3>${item.name}</h3>
      <div style="margin-top:4px;">
        <span class="b">${item.cat || 'Allgemein'}</span>
        <span class="b d0">${item.diff || 'Anfänger'}</span>
      </div>
      ${item.eff ? `<div style="margin-top:4px;"><span class="b" style="background:#fff2cc; color:#b45f06;">${item.eff}</span></div>` : ''}
      <p style="margin-top:6px;">${item.summary || 'Keine Beschreibung vorhanden.'}</p>
    `;
    card.onclick = () => openTrick(item);
    itemsContainer.appendChild(card);
  });
}

function openTrick(item){
  $("view").innerHTML = `
    <div class='page'>
      <h2>${item.name}</h2>
      <p class='lead'><b>Bereich:</b> ${item.type.toUpperCase()} | <b>Kategorie:</b> ${item.cat || 'Allgemein'} | <b>Schwierigkeit:</b> ${item.diff || 'Anfänger'}</p>
      <p class='lead'>${item.summary || ''}</p>
      <h4>Erklärung & Anleitung</h4>
      <div class='tip'>${item.explanation || 'Keine Erklärung vorhanden.'}</div>
      <div class='acts' style='margin-top:20px;'><button id='vback'>Zurück zur Übersicht</button></div>
    </div>
  `;
  show("view");
  $("vback").onclick = () => show("list");
}

// Event-Listener für die Hauptreiter (Tricks, Techniken, Gimmicks)
document.querySelectorAll("#mainTabs .chip").forEach(btn => {
  btn.onclick = (e) => {
    document.querySelectorAll("#mainTabs .chip").forEach(b => b.classList.remove("on"));
    e.target.classList.add("on");
    currentTab = e.target.getAttribute("data-tab");
    currentFilter = "Alle"; // Filter zurücksetzen beim Tab-Wechsel
    renderFilterChips();
    loadItems();
  };
});

$("q").oninput = () => loadItems();

// Formular zum Hinzufügen (passt sich dynamisch dem aktiven Tab an!)
$("add").onclick = () => {
  let selectOptions = "";
  (CATEGORIES[currentTab] || []).forEach(o => {
    if(o !== "Alle") selectOptions += `<option value="${o}">${o}</option>`;
  });

  $("form").innerHTML = `
    <div class='page'>
      <h2>Neu hinzufügen zu: ${currentTab.toUpperCase()}</h2>
      <label>Name / Bezeichnung</label>
      <input id='fn' type='text' placeholder='Name eingeben...' style='width:100%; margin-bottom:10px;'>
      
      <label>Unterkategorie</label>
      <select id='fc' style='width:100%; margin-bottom:10px;'>${selectOptions}</select>

      <label>Effekt / Markierung</label>
      <input id='feff' type='text' placeholder='z.B. Teleportation, Falschgriff' style='width:100%; margin-bottom:10px;'>

      <label>Kurzbeschreibung (Effekt)</label>
      <textarea id='fs' placeholder='Was passiert oder wofür wird es genutzt?'></textarea>
      
      <label>Ausführliche Anleitung / Geheimnis</label>
      <textarea id='fe' placeholder='Schritt-für-Schritt Erklärung...'></textarea>
      
      <div class='acts' style='margin-top:15px;'>
        <button class='p' id='fsa'>In Cloud speichern</button>
        <button id='fca'>Abbrechen</button>
      </div>
    </div>
  `;
  show("form");
  
  $("fca").onclick = () => show("list");
  $("fsa").onclick = () => {
    const name = $("fn").value.trim();
    if(!name) return alert("Bitte einen Namen eingeben!");
    
    const savedData = localStorage.getItem("zauber_wiki_data");
    let allData = savedData ? JSON.parse(savedData) : [...DEFAULT_DATA];
    
    allData.push({
      id: "item_" + Date.now(),
      type: currentTab,
      name: name,
      cat: $("fc").value,
      diff: "Anfänger",
      eff: $("feff").value.trim() ? "✨ " + $("feff").value.trim() : "",
      summary: $("fs").value.trim(),
      explanation: $("fe").value.trim()
    });
    
    localStorage.setItem("zauber_wiki_data", JSON.stringify(allData));
    alert("Erfolgreich hinzugefügt!");
    show("list");
    loadItems();
  };
};

// Admin-Knöpfe oben funktionsfähig machen
$("btnAuth").onclick = () => {
  isAdmin = !isAdmin;
  if(!isAdmin) {
    $("adminName").textContent = "👤 Gast-Modus";
    $("btnAuth").textContent = "Anmelden";
    $("btnCodes").classList.add("hide");
    $("btnManage").classList.add("hide");
  } else {
    $("adminName").textContent = "👤 Linus · Admin";
    $("btnAuth").textContent = "Abmelden";
    $("btnCodes").classList.remove("hide");
    $("btnManage").classList.remove("hide");
  }
};
$("btnCodes").onclick = () => alert("Deine geheimen Admin-Zugangscodes lauten: [ZYLINDER_2026], [ABRACADABRA]");
$("btnManage").onclick = () => alert("Einstellungs-Verwaltung geöffnet! Hier kannst du später Nutzer sperren oder Kanäle moderieren.");

// Beim Start direkt alles initialisieren
window.addEventListener("DOMContentLoaded", () => {
  renderFilterChips();
  loadItems();
});
</script>
</body>
</html>
