<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZauberWiki – Tricks & Erklärungen</title>
<style>
:root{--bg:#f6f3fa;--card:#fff;--tx:#241f2e;--mu:#6f6a7c;--ac:#6b3fa0;--ac2:#efe6fa;--bd:#e4def0;--ok:#2f8f5b;--wa:#c27a14;--er:#b83a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121b;--card:#211d2b;--tx:#efeaf6;--mu:#a49eb4;--ac:#b88cf0;--ac2:#2d2540;--bd:#383147}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#4b2a7a,#8a4fc7);color:#fff;padding:28px 16px 22px}
.hero>div,.w{max-width:880px;margin:0 auto}
.hero h1{font-family:Georgia,serif;margin:0;font-size:2rem}.hero p{margin:4px 0 0;opacity:.85}
.w{padding:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;max-width:100%}
textarea{width:100%;min-height:100px;resize:vertical}input[type=text],input[type=url],input[type=search]{width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 13px;font-size:.88rem}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.c:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(107,63,160,.15)}
.ic{font-size:1.6rem}.c h3{margin:0;font-size:1.05rem}.c p{margin:0;color:var(--mu);font-size:.9rem}
.page{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:10px}
.page h2{margin:6px 0 8px;font-family:Georgia,serif;font-size:1.7rem}
.mu{color:var(--mu);font-size:.85rem}.hide{display:none}.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:14px;right:14px;max-width:380px;margin-left:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:min(60vh,460px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
#cp.hide{display:none}
#cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="hero"><div><h1>🎩 ZauberWiki</h1><p>Zaubertricks mit Erklärung – gemeinsam gesammelt.</p></div></div>
<div id="gate" class="w hide"><p class="mu">Lade …</p></div>

<div id="app" class="w">
  <div id="list">
    <div class="bar">
      <input id="q" type="search" placeholder="Tricks durchsuchen …">
      <button class="p" id="add">+ Neu</button>
    </div>
    <div class="grid" id="items"></div>
  </div>
  <div id="view" class="hide"></div>
  <div id="form" class="hide"></div>
</div>

<!-- Richtige Supabase Bibliothek laden -->
<script src="https://jsdelivr.net"></script>

<script>
const $=id=>document.getElementById(id);

// Deine echten Supabase-Verbindungsdaten
const supabaseUrl = 'https://supabase.co';
const supabaseAnonKey = 'sb_publishable_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5dGx5bGNnZ2Z6cXhibGNhcGRxcSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzMxNDIwNjc3LCdleHAiOjIwNDcwOTY2Nzd9.U0yG6pC7Lsk_UuD32p9p66XG_i43uG7_8x4Wv_L-XkY';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

function show(w) {
  $("list").classList.toggle("hide", w !== "list");
  $("view").classList.toggle("hide", w !== "view");
  $("form").classList.toggle("hide", w !== "form");
}

// Tricks aus Supabase laden und anzeigen
async function loadTricks() {
  $("items").innerHTML = "<p class='mu'>Tricks werden geladen ...</p>";
  const searchWord = $("q").value.toLowerCase();
  
  const { data, error } = await supabaseClient
    .from('techniques')
    .select('*')
    .order('created_at', { ascending: false });
    
  if (error) {
    $("items").innerHTML = "<p style='color:var(--er)'>Fehler beim Laden der Datenbank!</p>";
    return;
  }
  
  $("items").innerHTML = "";
  const filtered = data.filter(t => t.name.toLowerCase().includes(searchWord));
  
  if(filtered.length === 0) {
    $("items").innerHTML = "<p class='mu'>Noch keine Tricks vorhanden. Klicke auf '+ Neu' um den ersten zu erstellen!</p>";
    return;
  }
  
  filtered.forEach(trick => {
    const card = document.createElement("div");
    card.className = "c";
    card.innerHTML = `<h3>✨ ${trick.name}</h3><p>${trick.summary || 'Keine Beschreibung'}</p>`;
    card.onclick = () => openTrick(trick);
    $("items").appendChild(card);
  });
}

// Einzelnen Trick ansehen
function openTrick(trick) {
  $("view").innerHTML = `
    <div class='page'>
      <h2>${trick.name}</h2>
      <p class='lead'>${trick.summary || ''}</p>
      <h4>Erklärung & Geheimnis</h4>
      <div class='tip'>${trick.explanation || 'Keine Erklärung vorhanden.'}</div>
      <div class='acts' style='margin-top:20px;'><button id='vback'>Zurück zur Übersicht</button></div>
    </div>
  `;
  show("view");
  $("vback").onclick = () => show("list");
}

// Suche aktivieren
$("q").oninput = () => loadTricks();

// Formular für neuen Trick öffnen
$("add").onclick = () => {
  $("form").innerHTML = `
    <div class='page'>
      <h2>Neuen Zaubertrick hinzufügen</h2>
      <label>Name des Tricks</label>
      <input id='fn' type='text' placeholder='z.B. French Drop' style='width:100%; margin-bottom:10px;'>
      <label>Der Effekt (Was sieht der Zuschauer?)</label>
      <textarea id='fs' placeholder='z.B. Eine Münze verschwindet spurlos aus der Hand...'></textarea>
      <label>Das Geheimnis (Schritt-für-Schritt-Erklärung)</label>
      <textarea id='fe' placeholder='Wie funktioniert der Trick im Detail?'></textarea>
      <div class='acts' style='margin-top:15px;'>
        <button class='p' id='fsa'>In Cloud speichern</button>
        <button id='fca'>Abbrechen</button>
      </div>
    </div>
  `;
  show("form");
  
  $("fca").onclick = () => show("list");
  $("fsa").onclick = async () => {
    const name = $("fn").value.trim();
    const summary = $("fs").value.trim();
    const explanation = $("fe").value.trim();
    
    if(!name) return alert("Bitte gib einen Namen für den Trick ein!");
    
    $("fsa").disabled = true;
    $("fsa").textContent = "Wird gespeichert ...";
    
    const { error } = await supabaseClient.from('techniques').insert([{
      id: "t_" + Date.now(),
      name: name,
      summary: summary,
      explanation: explanation
    }]);
    
    if (error) {
      alert("Fehler beim Speichern: " + error.message);
      $("fsa").disabled = false;
      $("fsa").textContent = "In Cloud speichern";
    } else {
      alert("Erfolgreich in deiner Online-Datenbank gespeichert!");
      show("list");
      loadTricks();
    }
  };
};

// Beim Start direkt die Liste laden
window.addEventListener("DOMContentLoaded", () => {
  loadTricks();
});
</script>
</body>
</html>
