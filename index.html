<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZauberWiki – Tricks & Erklärungen</title>
<style>
:root{--bg:#f6f3fa;--card:#fff;--tx:#241f2e;--mu:#6f6a7c;--ac:#6b3fa0;--ac2:#efe6fa;--bd:#e4def0;--ok:#2f8f5b;--wa:#c27a14;--er:#b83a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121b;--card:#211d2b;--tx:#efeaf6;--mu:#a49eb4;--ac:#b88cf0;--ac2:#2d2540;--bd:#383147}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#4b2a7a,#8a4fc7);color:#fff;padding:28px 16px 22px}
.hero>div,.w{max-width:880px;margin:0 auto}
.hero h1{font-family:Georgia,serif;margin:0;font-size:2rem}.hero p{margin:4px 0 0;opacity:.85}
.w{padding:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;max-width:100%}
textarea{width:100%;min-height:100px;resize:vertical}input[type=text],input[type=url],input[type=search]{width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 13px;font-size:.88rem;background:var(--card);border:1px solid var(--bd)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.c:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(107,63,160,.15)}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px;background:var(--ac2);color:var(--ac)}
.d0{background:#e3f4ea;color:var(--ok)}.d1{background:#fbf0dc;color:var(--wa)}.d2{background:#f9e3e8;color:var(--er)}
.page{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:10px}
.page h2{margin:6px 0 8px;font-family:Georgia,serif;font-size:1.7rem}
.mu{color:var(--mu);font-size:.85rem}.hide{display:none}.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:14px;right:14px;max-width:380px;margin-left:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:min(60vh,460px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
#cp.hide{display:none}
#cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1;min-width:0}
#who{font-size:.9rem;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;display:inline-flex;gap:8px;align-items:center;margin-top:8px}
#who button{padding:2px 10px;font-size:.8rem;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);border-radius:8px;}
</style>
</head>
<body>
<div class="hero">
  <div>
    <h1>🎩 ZauberWiki</h1>
    <p>Zaubertricks mit Erklärung – gemeinsam gesammelt.</p>
    <div id="who">
      <span>👤 Linus · Admin</span>
      <button onclick="alert('Abgemeldet!')">Abmelden</button>
      <button style="background:#e6b800; border-color:#e6b800; color:#241f2e;">🔑 Codes</button>
      <button>⚙️ Verwalten</button>
    </div>
  </div>
</div>
<div id="app" class="w">
  <div id="list">
    <div class="bar"><input id="q" type="search" placeholder="Tricks durchsuchen …"><button class="p" id="add">+ Neu</button></div>
    <div class="chips" id="tabs"><button class="chip on">🎩 Tricks</button><button class="chip">🧩 Techniken</button><button class="chip">🧰 Gimmicks</button></div>
    <div class="chips" id="chips"><button class="chip on">Alle</button><button class="chip">🃏 Karten</button><button class="chip">🪙 Münzen</button><button class="chip">🪢 Seil & Gummiband</button><button class="chip">🧠 Mentalmagie</button></div>
    <div class="grid" id="items"></div>
  </div>
  <div id="view" class="hide"></div>
  <div id="form" class="hide"></div>
</div>
<button id="cb" class="p">💬 Chat</button>
<script>
const $=id=>document.getElementById(id);
const DEFAULT_TRICKS = [
  {id:"d1",name:"Das springende Gummiband",cat:"Seil & Gummiband",diff:"Anfänger",eff:"✨ Teleportation",summary:"Ein Gummiband wechselt unsichtbar von zwei Fingern auf die anderen beiden."},
  {id:"d2",name:"Der 21-Karten-Trick",cat:"Karten",diff:"Anfänger",eff:"🧠 Gedankenlesen",summary:"Ein mathematischer Klassiker, bei dem du die gewählte Karte des Zuschauers errätst."}
];
function show(w){$("list").classList.toggle("hide",w!=="list");$("view").classList.toggle("hide",w!=="view");$("form").classList.toggle("hide",w!=="form")}
function loadTricks(){
  const itemsContainer=$("items");itemsContainer.innerHTML="";const searchWord=$("q").value.toLowerCase();
  const savedData=localStorage.getItem("zauber_tricks");const tricks=savedData?JSON.parse(savedData):DEFAULT_TRICKS;
  const filtered=tricks.filter(t=>t.name.toLowerCase().includes(searchWord));
  if(filtered.length===0){itemsContainer.innerHTML="<p class='mu'>Keine Tricks gefunden.</p>";return}
  filtered.forEach(trick=>{
    const card=document.createElement("div");card.className="c";
    let icon="✨";if(trick.cat==="Karten")icon="🃏";if(trick.cat==="Münzen")icon="🪙";if(trick.cat==="Seil & Gummiband")icon="🪢";if(trick.cat==="Mentalmagie")icon="🧠";
    card.innerHTML=`<div style="font-size:1.5rem; margin-bottom:4px;">${icon}</div><h3>${trick.name}</h3><div style="margin-top:4px;"><span class="b">${trick.cat||'Sonstiges'}</span><span class="b d0">${trick.diff||'Anfänger'}</span></div>${trick.eff?`<div style="margin-top:4px;"><span class="b" style="background:#fff2cc; color:#b45f06;">${trick.eff}</span></div>`:''}<p style="margin-top:6px;">${trick.summary||'Keine Beschreibung vorhanden.'}</p>`;
    card.onclick=()=>openTrick(trick);itemsContainer.appendChild(card);
  });
}
function openTrick(trick){
  $("view").innerHTML=`<div class='page'><h2>${trick.name}</h2><p class='lead'><b>Kategorie:</b> ${trick.cat||'Sonstiges'} | <b>Schwierigkeit:</b> ${trick.diff||'Anfänger'}</p><p class='lead'>${trick.summary||''}</p><h4>Erklärung & Geheimnis</h4><div class='tip'>${trick.explanation||'Du hast das Geheimnis für diesen Trick noch nicht aufgeschrieben. Klicke auf Bearbeiten, um es hinzuzufügen!'}</div><div class='acts' style='margin-top:20px;'><button id='vback'>Zurück zur Übersicht</button></div></div>`;
  show("view");$("vback").onclick=()=>show("list");
}
$("q").oninput=()=>loadTricks();
$("add").onclick=()=>{
  $("form").innerHTML=`<div class='page'><h2>Neuen Zaubertrick hinzufügen</h2><label>Name des Tricks</label><input id='fn' type='text' placeholder='z.B. French Drop' style='width:100%; margin-bottom:10px;'><label>Kategorie</label><select id='fc' style='width:100%; margin-bottom:10px;'><option value="Karten">🃏 Karten</option><option value="Münzen">🪙 Münzen</option><option value="Seil & Gummiband">🪢 Seil & Gummiband</option><option value="Mentalmagie">🧠 Mentalmagie</option><option value="Sonstiges">✨ Sonstiges</option></select><label>Effekt-Art</label><input id='feff' type='text' placeholder='z.B. Teleportation, Gedankenlesen' style='width:100%; margin-bottom:10px;'><label>Der Effekt (Was sieht der Zuschauer?)</label><textarea id='fs' placeholder='z.B. Eine Münze verschwindet spurlos...'></textarea><label>Das Geheimnis (Schritt-für-Schritt-Erklärung)</label><textarea id='fe' placeholder='Wie funktioniert der Trick im Detail?'></textarea><div class='acts' style='margin-top:15px;'><button class='p' id='fsa'>Lokal speichern</button><button id='fca'>Abbrechen</button></div></div>`;
  show("form");$("fca").onclick=()=>show("list");
  $("fsa").onclick=()=>{
    const name=$("fn").value.trim();const category=$("fc").value;const effectArt=$("feff").value.trim();const summary=$("fs").value.trim();const explanation=$("fe").value.trim();
    if(!name)return alert("Bitte gib einen Namen für den Trick ein!");
    const savedData=localStorage.getItem("zauber_tricks");let tricks=savedData?JSON.parse(savedData):[...DEFAULT_TRICKS];
    tricks.push({id:"t_"+Date.now(),name:name,cat:category,diff:"Anfänger",eff:effectArt?"✨ "+effectArt:"",summary:summary,explanation:explanation});
    localStorage.setItem("zauber_tricks",JSON.stringify(tricks));alert("Erfolgreich gespeichert!");show("list");loadTricks();
  };
};
window.addEventListener("DOMContentLoaded",()=>loadTricks());
</script>
</body>
</html>
