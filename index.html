<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZauberWiki – Tricks & Erklärungen</title>
<style>
:root{--bg:#f6f3fa;--card:#fff;--tx:#241f2e;--mu:#6f6a7c;--ac:#6b3fa0;--ac2:#efe6fa;--bd:#e4def0;--ok:#2f8f5b;--wa:#c27a14;--er:#b83a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121b;--card:#211d2b;--tx:#efeaf6;--mu:#a49eb4;--ac:#b88cf0;--ac2:#2d2540;--bd:#383147}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,sans-serif}
.hero{background:linear-gradient(135deg,#4b2a7a,#8a4fc7);color:#fff;padding:28px 16px 22px}
.hero>div,.w{max-width:880px;margin:0 auto}
.hero h1{font-family:Georgia,serif;margin:0;font-size:2rem}.hero p{margin:4px 0 0;opacity:.85}
.w{padding:16px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;width:100%;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input[type=search]{width:auto;flex:1;margin-bottom:0}
button{cursor:pointer;width:auto;margin-bottom:0}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 13px;font-size:.88rem;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.c:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(107,63,160,.15)}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px;background:var(--ac2);color:var(--ac);width:auto}
.d0{background:#e3f4ea;color:var(--ok)}.d1{background:#fbf0dc;color:var(--wa)}.d2{background:#f9e3e8;color:var(--er)}
.page{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:10px}
.page h2{margin:6px 0 8px;font-family:Georgia,serif;font-size:1.7rem}
.lead{color:var(--mu);font-size:1.05rem;margin:8px 0 16px}
.tip{background:var(--ac2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;margin-bottom:10px}
video,iframe{width:100%;border-radius:14px;background:#000;max-height:40vh;margin-top:10px;height:240px}
.hide{display:none}.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:14px;right:14px;max-width:380px;margin-left:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:min(50vh,400px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden}
#cp.hide{display:none}
.ch{padding:10px 14px;font-weight:700;background:var(--ac2);color:var(--ac);display:flex;gap:6px}
#cm{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{background:var(--ac2);border-radius:12px;padding:6px 10px;max-width:85%;align-self:flex-start}.m b{display:block;font-size:.75rem;color:var(--ac)}
.m.me{align-self:flex-end;background:var(--ac);color:#fff}.m.me b{color:#fff;opacity:.8}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1;min-width:0;margin-bottom:0}
#who{font-size:.9rem;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;display:inline-flex;gap:8px;align-items:center;margin-top:8px}
#who button{padding:2px 10px;font-size:.8rem;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);border-radius:8px;width:auto;margin-bottom:0}
.cadm{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd);align-items:center;font-size:.8rem}
.cadm input{padding:4px 8px;margin-bottom:0}
</style>
</head>
<body>
<div class="hero">
  <div>
    <h1>🎩 ZauberWiki</h1>
    <p>Zaubertricks mit Erklärung – gemeinsam gesammelt.</p>
    <div id="who">
      <span id="adminName">👤 Gast-Modus</span>
      <button id="btnAuth">Anmelden</button>
      <button id="btnCodes" class="hide" style="background:#e6b800; border-color:#e6b800; color:#241f2e;">🔑 Admin-Codes</button>
    </div>
  </div>
</div>
<div id="app" class="w">
  <div id="list">
    <div class="bar">
      <input id="q" type="search" placeholder="Tricks durchsuchen …">
      <select id="mf" style="flex:none;max-width:140px">
        <option value="">Alle Status</option>
        <option value="learned">✅ Gelernt</option>
        <option value="learning">📖 Am Lernen</option>
        <option value="fav">⭐ Lieblinge</option>
        <option value="toLearn">🎯 Zu lernen</option>
      </select>
      <button class="p" id="add">+ Neu</button>
    </div>
    <div class="chips" id="mainTabs">
      <button class="chip on" data-tab="tricks">🎩 Tricks</button>
      <button class="chip" data-tab="techniques">🧩 Techniken</button>
      <button class="chip" data-tab="gimmicks">🧰 Gimmicks</button>
    </div>
    <div class="chips" id="filterChips"></div>
    <div class="grid" id="items"></div>
  </div>
  <div id="view" class="hide"></div>
  <div id="form" class="hide"></div>
</div>
<button id="cb" class="p">💬 Chat</button>
<div id="cp" class="hide">
  <div class="ch"><select id="chs" style="margin-bottom:0; padding:4px; font-size:0.9rem;"></select></div>
  <div class="cadm hide" id="cadm"><input id="cn" type="text" placeholder="Neuer Kanal …"><button id="cadd" style="margin-bottom:0; padding:4px 10px;">+</button></div>
  <div id="cm"></div>
  <div class="cin"><input id="ci" type="text" placeholder="Nachricht schreiben …"><button class="p" id="cs">Senden</button></div>
</div>
<script src="https://jsdelivr.net"></script>
<script>
const $=id=>document.getElementById(id);
const supabaseUrl = 'https://supabase.co';
const supabaseAnonKey = 'sb_publishable_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5tGx5bGNnZ2Z6cXhibGNhcGRxcSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzMxNDIwNjc3LCdleHAiOjIwNDcwOTY2Nzd9.U0yG6pC7Lsk_UuD32p9p66XG_i43uG7_8x4Wv_L-XkY';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
let currentTab = "tricks"; let currentFilter = "Alle"; let userRole = "guest"; let currentChannel = "allgemein"; let myName = "Gast_" + Math.floor(Math.random() * 900 + 100);
function show(w){$("list").classList.toggle("hide",w!=="list");$("view").classList.toggle("hide",w!=="view");$("form").classList.toggle("hide",w!=="form")}
async function loadFilterChips() {
  const { data } = await supabaseClient.from('techniques').select('cat, type');
  const uniqueCats = new Set(["Alle"]);
  if(data) { data.forEach(item => { if(item.type === currentTab && item.cat) uniqueCats.add(item.cat); }); }
  const container = $("filterChips"); container.innerHTML = "";
  uniqueCats.forEach(catName => {
    const btn = document.createElement("button"); btn.className = `chip ${currentFilter === catName ? 'on' : ''}`; btn.textContent = catName;
    btn.onclick = () => { currentFilter = catName; renderFilterChips(); loadItems(); }; container.appendChild(btn);
  });
}
function renderFilterChips() { loadFilterChips(); }
async function loadItems(){
  const itemsContainer = $("items"); itemsContainer.innerHTML = "<p class='mu'>Lade Daten aus der Cloud ...</p>";
  const searchWord = $("q").value.toLowerCase(); const statusFilter = $("mf").value;
  let query = supabaseClient.from('techniques').select('*').eq('type', currentTab);
  if(statusFilter) query = query.eq('status', statusFilter);
  const { data, error } = await query.order('created_at', { ascending: false });
  if (error) { itemsContainer.innerHTML = "<p style='color:var(--er)'>Fehler beim Verbinden!</p>"; return; }
  itemsContainer.innerHTML = ""; let filtered = data || [];
  if (searchWord) filtered = filtered.filter(item => item.name.toLowerCase().includes(searchWord));
  if (currentFilter !== "Alle") filtered = filtered.filter(item => item.cat === currentFilter);
  if(filtered.length === 0){ itemsContainer.innerHTML = "<p class='mu'>Keine Einträge vorhanden.</p>"; return; }
  filtered.forEach(item => {
    const card = document.createElement("div"); card.className = "c";
    let statusBadge = item.status === 'learned' ? '✅ Gelernt' : item.status === 'learning' ? '📖 Am Lernen' : item.status === 'fav' ? '⭐ Liebling' : '🎯 Zu lernen';
    card.innerHTML = `<h3>✨ ${item.name}</h3><div><span class="b">${item.cat || 'Allgemein'}</span><span class="b d1">${statusBadge}</span></div><p style='margin:6px 0 0;color:var(--mu);font-size:.9rem'>${item.summary || ''}</p>`;
    card.onclick = () => openItem(item); itemsContainer.appendChild(card);
  });
}
function openItem(item){
  let videoHTML = item.video ? `<h4>Video</h4><video src="${item.video}" controls style="width:100%; border-radius:14px;"></video>` : "";
  if(item.video && (item.video.includes("youtube") || item.video.includes("youtu.be"))) {
    videoHTML = `<h4>Video</h4><p><a href="${item.video}" target="_blank" style="color:var(--ac);font-weight:bold;">👉 YouTube-Video öffnen</a></p>`;
  }
  let adminActions = userRole === "admin" ? `<button id='vdel' style='background:var(--er); color:#fff; border-color:var(--er)'>🗑️ Eintrag löschen</button>` : "";
  $("view").innerHTML = `<div class='page'><h2>${item.name}</h2><p style='color:var(--mu)'>Kategorie: ${item.cat} | Niveau: ${item.diff}</p><label>Status:</label><select id='changeStatus' style='width:auto;'><option value='toLearn' ${item.status==='toLearn'?'selected':''}>🎯 Zu lernen</option><option value='learning' ${item.status==='learning'?'selected':''}>📖 Am Lernen</option><option value='learned' ${item.status==='learned'?'selected':''}>✅ Gelernt</option><option value='fav' ${item.status==='fav'?'selected':''}>⭐ Lieblingstrick</option></select><p>${item.summary || ''}</p>${videoHTML}<h4>Anleitung</h4><div class='tip'>${item.explanation || 'Keine Erklärung.'}</div><div class='acts'><button id='vback'>Zurück</button> ${adminActions}</div></div>`;
  show("view"); $("vback").onclick = () => show("list");
  $("changeStatus").onchange = async (e) => { await supabaseClient.from('techniques').update({ status: e.target.value }).eq('id', item.id); alert("Status aktualisiert!"); loadItems(); };
  if($("vdel")) { $("vdel").onclick = async () => { if(confirm("Aus der Cloud löschen?")) { await supabaseClient.from('techniques').delete().eq('id', item.id); alert("Gelöscht!"); show("list"); loadItems(); loadFilterChips(); } }; }
}
$("add").onclick = () => {
  $("form").innerHTML = `<div class='page'><h2>Neu hinzufügen</h2><label>Name</label><input id='fn' type='text'><label>Unterkategorie</label><input id='fc' type='text' placeholder='z.B. Karten, Münzen...'><label>Schwierigkeit</label><select id='fd'><option value="Anfänger">Anfänger</option><option value="Fortgeschritten">Fortgeschritten</option><option value="Profi">Profi</option></select><label>Video-Link</label><input id='fvid' type='url'><label>Kurzbeschreibung</label><textarea id='fs'></textarea><label>Erklärung</label><textarea id='fe'></textarea><div class='acts'><button class='p' id='fsa'>In Cloud speichern</button><button id='fca'>Abbrechen</button></div></div>`;
  show("form"); $("fca").onclick = () => show("list");
  $("fsa").onclick = async () => {
    const name = $("fn").value.trim(); const cat = $("fc").value.trim() || "Sonstiges"; if(!name) return alert("Name fehlt!");
    await supabaseClient.from('techniques').insert([{ id:"item_"+Date.now(), type:currentTab, name:name, cat:cat, diff:$("fd").value, video:$("fvid").value.trim(), summary:$("fs").value.trim(), explanation:$("fe").value.trim(), status:"toLearn" }]);
    alert("Gespeichert!"); show("list"); loadItems(); loadFilterChips();
  };
};
$("cb").onclick = () => { $("cp").classList.toggle("hide"); loadChannels(); loadMessages(); };
async function loadChannels() {
  const { data } = await supabaseClient.from('channels').select('*'); const select = $("chs"); select.innerHTML = "";
  if(!data || data.length === 0) { await supabaseClient.from('channels').insert([{id:"allgemein", name:"💬 Allgemeiner Chat"}]); location.reload(); }
  data.forEach(ch => { const opt = document.createElement("option"); opt.value = ch.id; opt.textContent = ch.name; if(ch.id === currentChannel) opt.selected = true; select.appendChild(opt); });
}
$("chs").onchange = (e) => { currentChannel = e.target.value; loadMessages(); };
async function loadMessages() {
  const { data } = await supabaseClient.from('messages').select('*').eq('channel', currentChannel).order('created_at', { ascending: true });
  const box = $("cm"); box.innerHTML = "";
  if(data) { data.forEach(m => { const msg = document.createElement("div"); msg.className = `m ${m.user_name === myName ? 'me' : ''}`; let delBtn = userRole === "admin" ? `<button class="x" onclick="deleteMsg('${m.id}')">×</button>` : ""; msg.innerHTML = `<b>${m.user_name}</b>${m.text}${delBtn}`; box.appendChild(msg); }); box.scrollTop = box.scrollHeight; }
}
window.deleteMsg = async (id) => { await supabaseClient.from('messages').delete().eq('id', id); loadMessages(); };
$("cs").onclick = async () => { const text = $("ci").value.trim(); if(!text) return; await supabaseClient.from('messages').insert([{ id:"msg_"+Date.now(), channel:currentChannel, user_name:myName, text:text }]); $("ci").value = ""; loadMessages(); };
$("btnAuth").onclick = () => {
  if(userRole === "guest") {
    const code = prompt("Admin-Zugangscode:");
    if(code === "ZYLINDER_2026") { userRole = "admin"; myName = "Linus (Admin)"; $("adminName").textContent = "👤 Linus · Admin"; $("btnAuth").textContent = "Abmelden"; $("btnCodes").classList.remove("hide"); $("cadm").classList.remove("hide"); loadItems(); }
    else { alert("Falscher Code!"); }
  } else { userRole = "guest"; myName = "Gast"; $("adminName").textContent = "👤 Gast-Modus"; $("btnAuth").textContent = "Anmelden"; $("btnCodes").classList.add("hide"); $("cadm").classList.add("hide"); loadItems(); }
};
$("btnCodes").onclick = () => alert("🔑 Admin-Code: ZYLINDER_2026\n💬 Name: " + myName);
$("cadd").onclick = async () => { const name = $("cn").value.trim(); if(!name) return; await supabaseClient.from('channels').insert([{ id:"ch_"+Date.now(), name:"💬 " + name }]); $("cn").value = ""; loadChannels(); };
document.querySelectorAll("#mainTabs .chip").forEach(btn => { btn.onclick = (e) => { document.querySelectorAll("#mainTabs .chip").forEach(b => b.classList.remove("on")); e.target.classList.add("on"); currentTab = e.target.getAttribute("data-tab"); currentFilter = "Alle"; loadFilterChips(); loadItems(); }; });
$("q").oninput = () => loadItems(); $("mf").onchange = () => loadItems();
window.addEventListener("DOMContentLoaded", () => { loadFilterChips(); loadItems(); setInterval(() => { if(!$("cp").classList.contains("hide")) loadMessages(); }, 3000); });
</script>
</body>
</html>
